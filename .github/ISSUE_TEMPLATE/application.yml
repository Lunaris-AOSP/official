name: Maintainership Application
description: Submit this form to apply as an official Lunaris AOSP maintainer.
title: "[Maintainer Application] OnePlus Nord CE 3 Lite / Nord N30 5G (larry)"
labels:
  - maintainership
  - application
assignees:
  - GHOST
  - Arijit
  - Sanji

body:
  - type: input
    attributes:
      label: 📱 Device Name
      description: "Example: POCO F5 (marble)"
      value: "OnePlus Nord CE 3 Lite / Nord N30 5G (larry)"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🧩 Device Tree Sources
      description: "Provide links to your device sources (one URL per line)."
      placeholder: |
        https://github.com/ViaanLarryROMS/android_device_oneplus_larry
        https://github.com/ViaanLarryROMS/android_device_sm6375-common
        https://github.com/ViaanLarryROMS/proprietary_vendor_oneplus_larry
        https://github.com/ViaanLarryROMS/proprietary_vendor_sm6375-common
        https://github.com/ViaanLarryROMS/android_kernel_oneplus_sm6375
        https://github.com/ViaanLarryROMS/android_hardware_oplus
    validations:
      required: true

  - type: input
    attributes:
      label: 📦 ROMs You Maintain
      description: "List the ROM(s) you maintain and specify whether they are official or unofficial."
      value: "EvolutionX (Unofficial), crDroid (Unofficial), OrionOS (Unofficial)"
    validations:
      required: true

  - type: input
    attributes:
      label: 🌙 Link to Lunaris AOSP Unofficial Build
      description: "Provide a link to one of your released Lunaris AOSP unofficial builds (e.g., Telegram, XDA, etc.)."
      value: "https://xdaforums.com/t/unofficial-rom-16-lunarisaosp-for-the-nord-ce-3-lite-nord-n30.4775619/"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🐞 Build Bugs (if any)
      description: "List known issues or bugs currently present in your build, if applicable."
      placeholder: "Minor IMS quirks; otherwise daily-driver usable."
    validations:
      required: false

  - type: input
    attributes:
      label: 🧠 Building Experience
      description: "Mention how long you have been building ROMs (in years or months)."
      value: "7 months"
    validations:
      required: true

  - type: textarea
    attributes:
      label: ⚠️ Exceptions / Special Concerns
      description: "Mention any exceptions, special requests, or additional information."
      placeholder: "Maintains unified sm6375-common trees for Nord CE 3 Lite / Nord N30"

  - type: input
    attributes:
      label: 💬 Contact Information
      description: "Provide your Telegram username or another preferred contact method."
      value: "@VIAAN_THAKUR"
    validations:
      required: true

  - type: input
    attributes:
      label: 🧑‍💻 GitHub Username
      description: "Enter your GitHub handle."
      value: "ViaanLarryROMS"
    validations:
      required: true
